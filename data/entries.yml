# Single source for the README. Edit this file, then run scripts/build_readme.py.
# Facts come from each project's own README or code. Use unknown when they are silent.
# Do not write the word that means a television was tried by us.

safety: >
  ADB and similar debug tools can leave a television without a home screen,
  without inputs, or without updates. Prefer the Start here row for that brand.
  Write down package names before disabling anything, and keep the project's own
  way back. This list is not a set of instructions, and it does not claim that
  these projects were run on a television here. Every cell comes from that
  project's README or code. The link on the cell is that page. Where the project
  is silent, the cell says unknown.

how_to_read: >
  Root is yes, no, or depends. Undo is yes, partial, or no, followed by the way
  back the project describes. PC is whether a computer is required. unknown means
  that project's README or code does not say. Stars and the last commit date come
  from the GitHub API. A project that is not hosted on GitHub has unknown in those
  two cells. The license is an SPDX identifier taken from the project's license
  file, or unknown when no license is stated. Kind is one or more of DNS blocking,
  clean launcher, ad-free client, ADB debloat, homebrew, and firmware / root.

platforms:
  - id: android-tv
    title: Google TV and Android TV
    start_here: tellyscope
    start_here_text: >
      The README says the phone app needs no root and no computer, disables
      built-in apps instead of uninstalling them, keeps a protected list, and
      can turn back on only what it turned off.
    start_here_source: https://github.com/man15h/tellyscope/blob/main/README.md
  - id: fire-tv
    title: Fire TV
    start_here: hearth
    start_here_text: >
      The README says Amazon's launcher stays installed and enabled, pressing
      Home twice still opens it, and SKIP_DEBLOAT=1 installs the home screen
      without the package cleanup. uninstall.sh removes that install.
    start_here_source: https://github.com/Srikarmk/hearth/blob/main/README.md
  - id: webos
    title: LG webOS
    start_here: free-my-tv
    start_here_text: >
      The README says the LG app installs through LG Developer Mode, nothing is
      rooted, LG's home screen stays where it is, and webos/install.py
      --uninstall removes the app.
    start_here_source: https://github.com/simbasjungles/free-my-tv/blob/main/README.md
  - id: tizen
    title: Samsung Tizen
    start_here: free-my-tv
    start_here_text: >
      The README says the Samsung app installs through Samsung Developer Mode,
      nothing is rooted, Samsung's home screen stays where it is, and
      tizen/install.py --uninstall removes a copy left behind.
    start_here_source: https://github.com/simbasjungles/free-my-tv/blob/main/README.md
  - id: oem-android
    title: Xiaomi, TCL, Hisense and other Android OEMs
    start_here: aerial-tv
    start_here_text: >
      The README says Aerial needs no root, does not modify system apps, and a
      restore command returns the previous desktop. A USB-stick install is also
      described, so a computer is not the only path. Hisense VIDAA is not this
      table. CleanYourTV's README says VIDAA has no ADB path.
    start_here_source: https://github.com/pengchujin/aerial-tv/blob/main/README.md
  - id: roku
    title: Roku
    start_here: roku-ads
    start_here_text: >
      This hosts file is the only Roku-specific public list in v1. The README
      says banner containers may still show up empty. It does not say whether
      root is involved, how to remove the list, or whether a computer is required.
    start_here_source: https://github.com/b02860de585071a2/pihole-roku-ads-blocklist/blob/main/README.md
  - id: network
    title: Network DNS for any brand
    start_here: adguard-home
    start_here_text: >
      The README calls it a network-wide ads and trackers DNS server, names
      smart TVs as a place that kind of blocking helps, says it can run without
      root, and documents an uninstall flag. The same README says DNS blocking
      cannot remove YouTube or Twitch ads.
    start_here_source: https://github.com/AdguardTeam/AdGuardHome/blob/master/README.md

