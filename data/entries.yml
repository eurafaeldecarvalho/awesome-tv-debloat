left_out:
  - name: NextDNS CLI
    url: https://github.com/nextdns/nextdns
    why: The README describes a DNS-over-HTTPS client for routers and desktops. It does not say the client blocks ads, and it does not mention televisions.
  - name: samsung-tizen-tv-debloat
    url: https://github.com/ardazeytin/samsung-tizen-tv-debloat
    why: The README says sdb cannot remove the ads, and that the steps which do cut ads are remote settings rather than this tool.
  - name: personalDNSfilter
    url: https://github.com/IngoZenz/personaldnsfilter
    why: The README is only a pointer to an external site, so root, undo and television scope are not stated in the repository. dumbtv documents the copy it runs.
  - name: webOS Dev Manager
    url: https://github.com/webosbrew/dev-manager-desktop
    why: Desktop tool for developer mode and rooted webOS. It installs packages and does not itself remove ads. The YouTube webOS row links it as an install path.
  - name: Firestick Cleaner and Launcher Replacer
    url: https://github.com/niftiest/Firestick-Cleaner-And-Launcher-Replacer
    why: Overlaps the Projectivy installer row. That row is the one whose README states an undo log.
  - name: uveer18/xiaomitv
    url: https://github.com/uveer18/xiaomitv
    why: The README follows the CleanYourTV prompt and launcher, and the license file keeps Gathin's copyright, so it is not a separate Xiaomi tool.
  - name: SmartTubeLegacy
    url: https://github.com/yuliskov/SmartTubeLegacy
    why: GitHub marks the repository archived. SmartTube is the current project.
  - name: Apps2Samsung
    url: https://github.com/Apps2Samsung/Apps2Samsung
    why: Named by TizenTube's install guide as the installer. Its own root and undo statements were not reviewed, so it has no row.
  - name: Awesome Android TV FOSS Apps
    url: https://github.com/Generator/Awesome-Android-TV-FOSS-Apps
    why: Linked under Related lists. Its text and layout are not reused, and it is a general app list rather than a brand-by-brand ad-strip table.
  - name: Hisense VIDAA, Vizio, and Roku beyond DNS
    url: https://github.com/Gathin23/cleanyourtv/blob/main/README.md
    why: CleanYourTV's README says VIDAA, Vizio and Roku have no ADB path. No other public README in this pass stated a reversible on-device tool for VIDAA or Vizio. Roku is only the hosts list above.
  - name: Country forks and skins
    url: https://github.com/Gathin23/cleanyourtv
    why: Forks and skins of CleanYourTV, Aerial, Free My TV and TV Detox repeat the upstream claims. Quiet TV and 简居 TV stay because their READMEs add their own scope.
